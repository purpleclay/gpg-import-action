name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Needed by checkout to fetch the repository
      security-events: write # Needed by zizmor-action to publish scan results as code scanning alerts
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            github.com:443
            production.cloudflare.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic

      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
    steps:
      - name: harden_runner (ubuntu)
        if: matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-26.04-arm'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: harden_runner (macos)
        if: matrix.os == 'macos-26'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate_gpg_key
        id: gpg
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg-fixture
        run: |
          set -euo pipefail
          mkdir -m 700 "${GNUPGHOME}"

          # A throwaway identity, generated fresh in an isolated homedir per
          # job. Fixed so the committer identity asserted below is
          # predictable; never reused outside this workflow.
          gpg --batch --pinentry-mode loopback --passphrase "arkhamcity" \
            --quick-generate-key "Batman <batman@dc.com>" default default never

          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"

          {
            echo "key<<GPG_KEY_EOF"
            gpg --batch --pinentry-mode loopback --passphrase "arkhamcity" \
              --armor --export-secret-keys "${fingerprint}"
            echo "GPG_KEY_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: run_action
        id: action
        uses: $/
        with:
          key: ${{ steps.gpg.outputs.key }}
          passphrase: arkhamcity
          trust-level: "5"

      - name: assert_signed_commit
        env:
          OS: ${{ matrix.os }}
          VERSION: ${{ steps.action.outputs.gpg-import-version }}
        run: |
          set -euo pipefail
          git commit --allow-empty -m "test: verify gpg import signing"

          # %G? is git's own signature-validity marker. run_action sets
          # trust-level: 5 (ultimate), so a correctly imported key signs
          # with a fully trusted, good signature: G.
          IFS=$'\t' read -r validity signer <<< "$(git log -1 --format='%G?%x09%GS')"

          case "${validity}" in
            G) ;;
            *) echo "::error::commit signature validity was '${validity}', expected 'G' (good, trusted)"; git log --show-signature -1; exit 1 ;;
          esac

          case "${signer}" in
            *"batman@dc.com"*) ;;
            *) echo "::error::signer '${signer}' did not match the imported identity"; exit 1 ;;
          esac

          {
            echo "### Verified signed commit (gpg-import ${VERSION}, ${OS})"
            echo
            echo '```'
            git log --show-signature -1
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
